[package]
name = "nas-disk-manager-axum"
version = "0.9.0"
edition = "2021"
autotests = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
